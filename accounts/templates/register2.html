{% extends 'base.html' %}

    {% block content %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<!--    <script type="text/javascript" src="reg.js"></script>-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-GLhlTQ8iRABdZLl6O3oVMWSktQOp6b7In1Zl3/Jr59b6EGGoI1aFkw7cmDA6j6gD" crossorigin="anonymous">
    <title>Document</title>
</head>
<style type="text/css">
    #passwordInput {

        display: flex;
        position: relative;

    }

    #passwordInput input[type="password"],
    #passwordInput input[type="text"] {
        width: 100%;
        padding: 0px;
        border: 1px solid lightgrey;
        border-radius: 6px;
        margin-left: 5%;
        font-size: 12px;

    }

    #passwordInput #showHide {
        font-size: 12px;
        font-weight: 600;
        position: absolute;
        color: red;
        right: 10px;
        top: 50%;
        transform: translateY(-50%);
        cursor: pointer;
        user-select: none;
    }

    #passwordStrength {
        width: 30%;
        height: 8px;
        margin: 8px 0;
        margin-left: 16px;
        display: none;
    }

    #passwordStrength span {
        position: relative;
        height: 100%;
        width: 100%;

        background: lightgrey;
        border-radius: 5px;
    }

    #passwordStrength span:nth-child(2) {
        margin: 0 3px;
    }

    #passwordStrength span.active:before {
        position: absolute;
        content: '';
        top: 0;
        left: 0;
        height: 100%;
        width: 100%;
        border-radius: 5px;

    }

    #passwordStrength span#poor:before {
        background-color: #f10014;
    }

    #passwordStrength span#weak:before {
        background-color: orange;
    }

    #passwordStrength span#strong:before {
        background-color: #23ad5c;
    }

    #passwordInfo {
        font-size: 15px;
        margin-left: 16px;
    }

    #passwordInfo #poor {
        color: red;
    }

    #passwordInfo #weak {
        color: orange;
    }

    #passwordInfo #strong {
        color: green;
    }
</style>

<body style="background-color: black; color: #EB7F23;">

  <section class="vh-100" style="background-color: #000000;">
    <div class="container h-100">
      <div class="row d-flex justify-content-center align-items-center h-100">
        <div class="col-lg-12 col-xl-11">
          <div class="card text-black" style="border-radius: 25px; background-color: black; color: #EB7F23;"></div>
            <div class="card-body p-md-5" >
              <div class="row justify-content-center">
                <div class="col-md-10 col-lg-6 col-xl-5 order-2 order-lg-1">

                  <p class="text-center h1 fw-bold mb-5 mx-1 mx-md-4 mt-4">Sign up</p>

                  <form class="mx-1 mx-md-4" action="/register" method="post">
                      {% csrf_token %}
                    {% for message in messages%}
                        <h2 style="color: 534d48;">{{message}}</h2>
                    {%endfor%}
                    <div class="d-flex flex-row align-items-center mb-4">
                      <i class="fas fa-user fa-lg me-3 fa-fw"></i>
                      <div class="form-outline flex-fill mb-0">
                        <input type="text" id="form3Example1c" class="form-control" name="username" />
                        <label class="form-label" for="form3Example1c">Your Name</label>
                      </div>
                    </div>

                    <div class="d-flex flex-row align-items-center mb-4">
                      <i class="fas fa-envelope fa-lg me-3 fa-fw"></i>
                      <div class="form-outline flex-fill mb-0">
                        <input type="email" id="form3Example3c" class="form-control" name="email"/>
                        <label class="form-label" for="form3Example3c">Your Email</label>
                      </div>
                    </div>

                    <div class="d-flex flex-row align-items-center mb-4">
                      <i class="fas fa-lock fa-lg me-3 fa-fw"></i>
                      <div class="form-outline flex-fill mb-0">
                        <input type="password" id="form3Example4c" class="form-control" name="password"/>
                        <label class="form-label" for="form3Example4c">Password</label>
                      </div>
                    </div>

                    <div class="d-flex flex-row align-items-center mb-4">
                      <i class="fas fa-key fa-lg me-3 fa-fw"></i>
                      <div class="form-outline flex-fill mb-0">
                        <input type="password" id="form3Example4cd" class="form-control" name="confirm-password"/>
                        <label class="form-label" for="form3Example4cd">Repeat your password</label>
                      </div>
                    </div>

                    <div class="form-check d-flex justify-content-center mb-5">
                      <input class="form-check-input me-2" type="checkbox" value="" id="form2Example3c" />
                      <label class="form-check-label" for="form2Example3">
                        I agree all statements in <a href="#!">Terms of service</a>
                      </label>
                    </div>

                    <div class="d-flex justify-content-center mx-4 mb-3 mb-lg-4">
                        <input type="submit" class="btn btn-primary btn-lg" name="submit" id="submit" value="REGISTER">
<!--                      <button type="button" >Register</button>-->
                    </div>
                    <p class="small fw-bold mt-2 pt-1 mb-0">Have an account? <a href="/login"
                      class="link-danger">login</a></p>
                      {% for message in messages%}
        <h2>{{message}}</h2>
        {%endfor%}

                  </form>


                </div>
                <div class="col-md-10 col-lg-6 col-xl-7 d-flex align-items-center order-1 order-lg-2">

                  <img src="https://mdbcdn.b-cdn.net/img/Photos/new-templates/bootstrap-registration/draw1.webp"
                    class="img-fluid" alt="Sample image">

                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>


    <script>
        let passwordInput = document.querySelector('#passwordInput input[type="password"]');
        let passwordStrength= document.getElementById('passwordStrength');
        let poor = document.querySelector('#passwordStrength #poor');
        let weak = document.querySelector('#passwordStrength #weak');
        let strong = document.querySelector('#passwordStrength #strong');
        let passwordInfo = document.getElementById('passwordInfo');

        let poorRegExp = /[a-z]/;
        let weakRegExp = /(?=.*?[0-9])/;;
        let strongRegExp = /(?=.*?[#?!@$%^&*-])/;
        let whitespaceRegExp = /^$|\s+/;


        passwordInput.oninput= function(){

             let passwordValue= passwordInput.value;
             let passwordLength= passwordValue.length;

             let poorPassword= passwordValue.match(poorRegExp);
             let weakPassword= passwordValue.match(weakRegExp);
             let strongPassword= passwordValue.match(strongRegExp);
             let whitespace= passwordValue.match(whitespaceRegExp);

     if(passwordValue != ""){

         passwordStrength.style.display = "block";
         passwordStrength.style.display = "flex";
         passwordInfo.style.display = "block";
         passwordInfo.style.color = "black";

         if(whitespace)
         {
          passwordInfo.textContent = "whitespaces are not allowed";
         }else{
         poorPasswordStrength(passwordLength, poorPassword, weakPassword, strongPassword);
         weakPasswordStrength(passwordLength, poorPassword, weakPassword, strongPassword);
         strongPasswordStrength(passwordLength, poorPassword, weakPassword, strongPassword);
        }


       }else{

         passwordStrength.style.display = "none";
         passwordInfo.style.display = "none";

       }
     }

    function poorPasswordStrength(passwordLength, poorPassword, weakPassword, strongPassword){

          if(passwordLength <= 3 && (poorPassword || weakPassword || strongPassword))
            {
           poor.classList.add("active");
           passwordInfo.style.display = "block";
           passwordInfo.style.color = "red";
           passwordInfo.textContent = "Your password is too Poor";

            }
    }

    function weakPasswordStrength(passwordLength, poorPassword, weakPassword, strongPassword){
       if(passwordLength>= 4 && poorPassword && (weakPassword || strongPassword))
        {
         weak.classList.add("active");
         passwordInfo.textContent = "Your password is Weak";
         passwordInfo.style.color = "orange";

       }else{
         weak.classList.remove("active");

       }
    }

    function strongPasswordStrength(passwordLength, poorPassword, weakPassword, strongPassword){

      if(passwordLength >= 6 && (poorPassword && weakPassword) && strongPassword)
        {
         poor.classList.add("active");
         weak.classList.add("active");
         strong.classList.add("active");
         passwordInfo.textContent = "Your password is strong";
         passwordInfo.style.color = "green";
       }else{
         strong.classList.remove("active");

       }
    }

    let showHide = document.querySelector('#passwordInput #showHide');

     showHide.onclick = function(){
          showHidePassword()
    }

    function showHidePassword(){
      if(passwordInput.type == "password"){
        passwordInput.type = "text";
        showHide.textContent = "HIDE";
        showHide.style.color = "green";
      }else{
        passwordInput.type = "password";
        showHide.textContent = "SHOW";
        showHide.style.color = "red";
      }
    }


          </script>

</body>

</html>


{% endblock content %}
